# Machine-readable architecture boundary policy for the project harness.
# See ARCHITECTURE.md for intent. Enforced by tests/architecture/test_package_boundaries.py.

[scan]
paths = [
  "packages",
  "harness",
  "evals",
  "tests/architecture",
]
exclude_globs = ["tests/fixtures/**"]

[product_domains]
domain_alpha = "packages/domain_alpha"
domain_beta = "packages/domain_beta"
domain_gamma = "packages/domain_gamma"
domain_delta = "packages/domain_delta"

[contracts]
path = "packages/contracts"

[harness]
paths = ["harness", "tests/architecture"]

[placeholder_only]
paths = [
  "packages/contracts",
  "packages/domain_alpha",
  "packages/domain_beta",
  "packages/domain_gamma",
  "packages/domain_delta",
  "evals",
]
executable_extensions = [".py", ".pyi", ".js", ".jsx", ".ts", ".tsx", ".go", ".rs", ".java", ".kt", ".sh"]

[restricted_imports.channel]
modules = ["telegram", "telebot"]
approved_paths = []

[restricted_imports.model_providers]
modules = ["openai", "anthropic", "google.generativeai"]
approved_paths = []

[restricted_imports.database]
modules = ["sqlalchemy", "psycopg2", "asyncpg"]
approved_paths = []

[restricted_imports.cloud]
modules = ["boto3", "google.cloud"]
approved_paths = []
