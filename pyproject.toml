[project]
name = "continuum-harness"
version = "0.0.0"
description = "H0 repository harness tooling for Project Continuum (not the product runtime)"
readme = "README.md"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/architecture/cases/**/*.py" = ["F401", "F811"]

[tool.ruff.format]
quote-style = "double"
